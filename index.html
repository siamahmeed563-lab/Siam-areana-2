<style>
/* Layout: one column arcade cabinet. Route strip on top, 16:9 pixel stage, four gauges, control deck. Dark by choice: it is a night-train game. */
:root{
  --bg:#140c1c; --panel:#1f1430; --panel2:#2a1b40; --line:#3d2a5a;
  --ink:#f6ead6; --muted:#a595bd; --amber:#f4b942; --go:#62d394; --warn:#ff7a59;
  --pix:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;
  --bn:'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;padding-inline:16px;padding-block:12px 22px;background:var(--bg);color:var(--ink);font-family:var(--pix);font-size:10px;line-height:1.6}
.app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:12px;letter-spacing:.05em;line-height:1.6;color:var(--amber);text-wrap:balance}
.clock{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.clock small{display:block;font-size:7px;color:var(--muted);text-align:right}
.route{position:relative;height:42px;margin-inline:7px}
.rl{position:absolute;top:26px;font-size:7px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.route .line{position:absolute;left:0;right:0;top:11px;height:4px;background:var(--line)}
.route .fill{height:100%;width:0;background:var(--amber)}
.dots{position:absolute;inset:0}
.dot{position:absolute;top:7px;width:12px;height:12px;margin-left:-6px;background:var(--panel);border:2px solid var(--line)}
.dot.done{background:var(--amber);border-color:var(--amber)}
.dot.cur{background:var(--ink);border-color:var(--ink)}
.mk{position:absolute;top:-1px;width:0;height:0;margin-left:-6px;border-inline:6px solid transparent;border-top:9px solid var(--go)}
.stage{position:relative;border:3px solid var(--line);background:#000;box-shadow:0 6px 0 #0b0610;line-height:0}
canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
.banner{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);padding:8px 10px;background:rgba(20,12,28,.88);border:2px solid var(--amber);line-height:1.5;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;pointer-events:none}
.banner.show{opacity:1;transform:none}
.banner .bn{font-family:var(--bn);font-weight:800;font-size:18px;color:var(--amber)}
.banner .en{font-size:9px;color:var(--ink)}
.banner .sub{font-size:8px;color:var(--muted)}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:7px 11px;background:var(--amber);color:#140c1c;font-size:9px;line-height:1.4;white-space:nowrap;pointer-events:none;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{min-width:0;padding:8px 10px;background:var(--panel);border:2px solid var(--line)}
.stat b{display:block;font-weight:400;font-size:7px;color:var(--muted);letter-spacing:.08em}
.stat span{display:block;font-size:11px;color:var(--ink);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.stat span.go{color:var(--go)}
.deck{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 90px;min-height:44px;padding:12px 14px;font:inherit;font-size:10px;color:var(--ink);background:var(--panel2);border:2px solid var(--line);box-shadow:0 4px 0 #0b0610;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0610}
.btn.on{background:var(--amber);color:#140c1c;border-color:var(--amber)}
.btn.horn{background:var(--warn);color:#140c1c;border-color:var(--warn)}
.btn:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.keys{font-size:7px;color:var(--muted);line-height:1.9}
@media (prefers-reduced-motion:reduce){.hint{animation:none}.banner{transition:none}}
</style>

  <header>
    <h1>INTERCITY<br>PIXEL TRAIN</h1>
    <div class="clock"><span id="clock">15:00</span><small>DHAKA &rarr; SYLHET</small></div>
  </header>
  <div class="route" id="route" aria-hidden="true">
    <div class="line"><div class="fill" id="fill"></div></div>
    <div class="dots" id="dots"></div>
    <div class="mk" id="mk"></div>
  </div>
  <div class="stage">
    <canvas id="cv" aria-label="Pixel art train travelling from Dhaka to Sylhet"></canvas>
    <div class="banner" id="banner"><div class="bn" id="bnBn"></div><div class="en" id="bnEn"></div><div class="sub" id="bnSub"></div></div>
    <div class="hint" id="hint" hidden>TAP TO DEPART</div>
  </div>
  <div class="stats">
    <div class="stat"><b>NEXT STOP</b><span id="stNext">-</span></div>
    <div class="stat"><b>DISTANCE</b><span id="stDist">-</span></div>
    <div class="stat"><b>SPEED</b><span id="stSpd">0 km/h</span></div>
    <div class="stat"><b>ABOARD</b><span id="stAbd">0</span></div>
    <div class="stat"><b>STATUS</b><span id="stStat" class="go">BOARDING</span></div>
  </div>
  <div class="deck">
    <button class="btn" id="btnPause" type="button">PAUSE</button>
    <button class="btn" id="btnSpeed" type="button">1x</button>
    <button class="btn" id="btnNext" type="button">NEXT</button>
    <button class="btn on" id="btnTime" type="button">TIME: AUTO</button>
    <button class="btn on" id="btnWx" type="button">SKY: AUTO</button>
    <button class="btn on" id="btnLight" type="button">LIGHTS: AUTO</button>
    <button class="btn horn" id="btnHorn" type="button">TAP HORN</button>
    <button class="btn on" id="btnSnd" type="button" aria-pressed="true">SND</button>
  </div>
  <div class="keys">KEYS: SPACE PAUSE / S SPEED / N NEXT / T TIME / W SKY / L LIGHTS / H HORN</div>
</div>

      if(p.st==='idle'){
        if(doors&&dwellT>=p.delay){
          p.st='walk';
          var b=0,bd=1e9;
          for(q=0;q<4;q++){var dd=Math.abs(dx[q]-p.x);if(dd<bd){bd=dd;b=q;}}
          p.tx=dx[b]+(hs(n*7)*6-3);
        }
      }else if(p.st==='walk'){
        dir=p.tx>p.x?1:-1;p.x+=dir*22*dt;p.ph+=dt*8;
        if(Math.abs(p.tx-p.x)<1.5)p.st='climb';
      }else if(p.st==='climb'){
        p.y-=14*dt;p.ph+=dt*8;p.a=clamp((p.y-168)/(PFY-168),0,1);
        if(p.y<=168){p.hide=true;p.st='done';aboard++;}
      }
    }else{
      if(p.st==='idle'){
        if(doors&&dwellT>=p.delay){
          p.st='drop';p.x=dx[(hs(n*5)*4)|0];p.y=168;p.a=0;p.ph=0;
          aboard=Math.max(0,aboard-1);
          p.tx=stX(cur)+(hs(n*13)>0.5?1:-1)*(110+hs(n*3)*70);
        }
      }else if(p.st==='drop'){
        p.y+=14*dt;p.ph+=dt*8;p.a=clamp((p.y-168)/(PFY-168),0,1);
        if(p.y>=PFY){p.y=PFY;p.a=1;p.st='walk';}
      }else if(p.st==='walk'){
        dir=p.tx>p.x?1:-1;p.x+=dir*22*dt;p.ph+=dt*8;
        if(Math.abs(p.tx-p.x)<1.5)p.st='done';
      }
    }
  }
}
function finishPax(){
  for(var n=0;n<pax.length;n++){
    var p=pax[n];
    if(p.hide)continue;
    if(p.kind==='wait'&&p.st!=='done'){p.hide=true;p.st='done';aboard++;}
    else if(p.kind==='alight'&&p.st==='idle'){p.hide=true;p.st='done';}
  }
}
/* ---------- journey ---------- */
var banEl=document.getElementById('banner'),bnBn=document.getElementById('bnBn'),bnEn=document.getElementById('bnEn'),bnSub=document.getElementById('bnSub');
var hideAt=0;
function showBanner(en,bn,sub,ms){
  bnEn.textContent=en;bnBn.textContent=bn;bnSub.textContent=sub;
  banEl.classList.add('show');
  hideAt=ms?performance.now()+ms:0;
}
function pad(n){return n<10?'0'+n:''+n;}
function clockStr(){
  var p=clamp((pos-stopHead(0))/(stopHead(N-1)-stopHead(0)),0,1),mins=15*60+Math.round(p*510);
  return pad(Math.floor(mins/60)%24)+':'+pad(mins%60);
}
function arrive(){
  state='dwell';cur=target;dwellT=0;turbo=false;doors=false;
  spawnPax(cur);chime();
  showBanner(ST[cur].en.toUpperCase(),ST[cur].bn,cur===N-1?'TERMINUS  '+clockStr():'ARRIVED  '+clockStr(),3800);
}
function depart(){
  departReq=false;
  if(cur>=N-1){
    fadeT=0.001;
    showBanner('JOURNEY COMPLETE','যাত্রা শেষ','Back to Dhaka...',2200);
    return;
  }
  target=cur+1;state='run';doors=false;
  horn();
  showBanner('NEXT: '+ST[target].en.toUpperCase(),ST[target].bn,(ST[target].km-ST[cur].km)+' km',2400);
}
function doReset(){
  pos=stopHead(0);vel=0;cur=0;target=1;state='dwell';dwellT=0;aboard=140;doors=false;turbo=false;
  parts=[];spawnPax(0);
  showBanner(ST[0].en.toUpperCase(),ST[0].bn,'BOARDING  '+clockStr(),3800);
}
function doNext(){
  if(fadeT>0)return;
  if(state==='dwell'){
    if(dwellT<DW){finishPax();dwellT=DW;}
    departReq=true;
  }else turbo=true;
}
function step(dt){
  time+=dt;wph+=vel*dt*0.22;
  rainLvl+=(rainT-rainLvl)*Math.min(1,dt*1.2);
  fogLvl+=(fogT-fogLvl)*Math.min(1,dt*1.2);
  if(fadeT>0){
    fadeT+=dt;
    if(!didReset&&fadeT>=1){doReset();didReset=true;}
    if(fadeT>=2){fadeT=0;didReset=false;}
  }
  if(state==='dwell'){
    dwellT+=dt;
    doors=dwellT>0.5&&dwellT<DW-0.6;
    if(fadeT===0&&dwellT>=DW)depart();
  }else{
    var d=stopHead(target)-pos,vmax=VMAX*(turbo?1.8:1);
    var vd=Math.min(vmax,Math.sqrt(2*BRK*Math.max(d,0))+4);
    vel+=clamp(vd-vel,-BRK*1.4*dt,ACC*dt);
    pos+=vel*dt;
    if(d<=0.8||pos>=stopHead(target)){pos=stopHead(target);vel=0;arrive();}
  }
  updatePax(dt);
  acc+=(3+(vel/VMAX)*12)*dt;
  while(acc>=1){
    acc-=1;
    parts.push({x:pos-14,y:136,vx:-vel*0.25-4,vy:-8-Math.random()*8,life:0,max:1.6+Math.random()*0.8});
  }
  var i;
  for(i=parts.length-1;i>=0;i--){
    var q=parts[i];q.life+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.life>q.max)parts.splice(i,1);
  }
  for(i=birds.length-1;i>=0;i--){
    var b=birds[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.ph+=dt*10;
    if(b.y<-10)birds.splice(i,1);
  }
  for(i=0;i<drops.length;i++){
    var r=drops[i];r.y+=240*r.s*dt;r.x-=40*r.s*dt;
    if(r.y>H){r.y=-4;r.x=Math.random()*(W+40);}
    if(r.x<0)r.x+=W;
  }
  hornT=Math.max(0,hornT-dt*0.9);
}
/* ---------- HUD and input ---------- */
function $(id){return document.getElementById(id);}
var elFill=$('fill'),elMk=$('mk'),elDots=$('dots'),elRoute=$('route'),elClock=$('clock');
var elNext=$('stNext'),elDist=$('stDist'),elSpd=$('stSpd'),elAbd=$('stAbd'),elStat=$('stStat'),elHint=$('hint');
var dotEls=[],lastKey='';
(function(){
  var i,d,l;
  for(i=0;i<N;i++){
    d=document.createElement('div');d.className='dot';d.style.left=(i/(N-1)*100)+'%';
    elDots.appendChild(d);dotEls.push(d);
  }
  [0,4,7,9].forEach(function(k){
    l=document.createElement('div');l.className='rl';l.textContent=ST[k].ab;l.style.left=(k/(N-1)*100)+'%';
    elRoute.appendChild(l);
  });
})();
function setT(el,t){if(el._t!==t){el._t=t;el.textContent=t;}}
function hud(){
  var pc=clamp((pos-stopHead(0))/(stopHead(N-1)-stopHead(0)),0,1);
  elFill.style.width=(pc*100).toFixed(1)+'%';
  elMk.style.left=(pc*100).toFixed(1)+'%';
  var key=cur+'|'+state;
  if(key!==lastKey){
    lastKey=key;
    for(var i=0;i<N;i++)dotEls[i].className='dot'+((i<cur||(i===cur&&state==='run'))?' done':'')+((i===cur&&state==='dwell')?' cur':'');
  }
  setT(elClock,clockStr());
  var nx=state==='dwell'?Math.min(cur+1,N-1):target,d=stopHead(nx)-pos;
  if(nx===cur&&state==='dwell'){setT(elNext,'TERMINUS');setT(elDist,'0 km');}
  else{
    setT(elNext,ST[nx].en);
    setT(elDist,Math.max(0,(d/SP)*(ST[nx].km-ST[nx-1].km)).toFixed(1)+' km');
  }
  setT(elSpd,Math.round(vel*0.62)+' km/h');
  setT(elAbd,''+aboard);
  var s;
  if(fadeT>0)s='TERMINUS';
  else if(state==='dwell')s=dwellT<DW-0.6?'BOARDING':'DEPARTING';
  else s=d<300?'ARRIVING':(turbo?'EXPRESS':'RUNNING');
  setT(elStat,s);
  if(hideAt&&performance.now()>hideAt){banEl.classList.remove('show');hideAt=0;}
}
var btnPause=$('btnPause'),btnSpeed=$('btnSpeed'),btnTime=$('btnTime'),btnWx=$('btnWx'),btnSnd=$('btnSnd');
function togglePause(){paused=!paused;btnPause.textContent=paused?'PLAY':'PAUSE';btnPause.classList.toggle('on',paused);}
function cycleSpeed(){spIdx=(spIdx+1)%SPEEDS.length;btnSpeed.textContent=SPEEDS[spIdx]+'x';}
function cycleTime(){timeMode=(timeMode+1)%4;btnTime.textContent='TIME: '+TMODES[timeMode];btnTime.classList.toggle('on',timeMode===0);}
function cycleWx(){wxMode=(wxMode+1)%4;btnWx.textContent='SKY: '+WMODES[wxMode];btnWx.classList.toggle('on',wxMode===0);}
function toggleSnd(){sndOn=!sndOn;btnSnd.textContent=sndOn?'SND ON':'SND OFF';btnSnd.classList.toggle('on',sndOn);btnSnd.setAttribute('aria-pressed',sndOn?'true':'false');if(sndOn)ensureAC();}
btnPause.addEventListener('click',togglePause);
btnSpeed.addEventListener('click',cycleSpeed);
$('btnNext').addEventListener('click',doNext);
btnTime.addEventListener('click',cycleTime);
btnWx.addEventListener('click',cycleWx);
var btnLight=$('btnLight');
function cycleLight(){lightMode=(lightMode+1)%3;btnLight.textContent='LIGHTS: '+LMODES[lightMode];btnLight.classList.toggle('on',lightMode===1);}
btnLight.addEventListener('click',cycleLight);
btnSnd.addEventListener('click',toggleSnd);
$('btnHorn').addEventListener('click',horn);
cv.addEventListener('click',function(){horn();});
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='BUTTON')return;
  var k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();togglePause();}
  else if(k==='s')cycleSpeed();
  else if(k==='n')doNext();
  else if(k==='t')cycleTime();
  else if(k==='w')cycleWx();
  else if(k==='l')cycleLight();
  else if(k==='h')horn();
});
try{
  if(document.fonts&&document.fonts.load){
    document.fonts.load('800 9px "Noto Sans Bengali"','ঢাকা');
    document.fonts.load('5px "Press Start 2P"','A');
  }
}catch(e){}
resize();
spawnPax(0);
showBanner(ST[0].en.toUpperCase(),ST[0].bn,'BOARDING  15:00',4000);
window.__pt=function(){return {state:state,cur:cur,pos:pos,vel:vel,aboard:aboard};};
var last=performance.now();
function frame(now){
  var dt=Math.min(0.1,(now-last)/1000);last=now;
  if(!paused&&!document.hidden){
    var d=dt*SPEEDS[spIdx],n=Math.max(1,Math.ceil(d/0.04));
    for(var i=0;i<n;i++)step(d/n);
  }
  render();hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();

</script>
